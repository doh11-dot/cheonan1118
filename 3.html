<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#dff6ff" />
<title>별별 토끼 🐰 | 귀여운 별 모으기 게임</title>
<style>
:root{--ink:#243b63;--blue:#4b9bed;--sky:#eaf8ff;--pink:#ff91bd;--yellow:#ffd773;--shadow:0 16px 48px rgba(55,109,163,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink)}body{background:radial-gradient(circle at 15% 12%,#fff5d7 0,transparent 28%),radial-gradient(circle at 90% 35%,#fbe5f1 0,transparent 28%),linear-gradient(160deg,#e6f8ff,#f2f7ff 60%,#f9efff);padding:24px 16px 30px;display:flex;justify-content:center;align-items:center;overflow-x:hidden}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #397ed6;outline-offset:3px}.shell{width:min(100%,860px);position:relative}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.brand-icon{display:grid;place-items:center;width:49px;height:49px;background:white;border-radius:17px;box-shadow:0 7px 18px #a8d7f477;font-size:28px;transform:rotate(-6deg)}h1{margin:0;font-size:clamp(22px,4vw,30px);letter-spacing:-1.4px}.subtitle{font-size:12px;color:#7892b1;margin:3px 0 0;font-weight:700}.pill{background:#fff;border:1px solid #dceaf7;box-shadow:0 5px 18px #a8cce333;border-radius:50px;padding:9px 13px;font-size:13px;font-weight:850;white-space:nowrap}.main{background:#fff;border:1px solid #fff;border-radius:30px;padding:16px;box-shadow:var(--shadow)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat{border-radius:17px;padding:12px 8px;text-align:center;background:#f1f9ff}.stat:nth-child(2){background:#fff8e7}.stat:nth-child(3){background:#fff1f7}.stat:nth-child(4){background:#f0f5ff}.stat .label{display:block;color:#8096af;font-size:11px;font-weight:850;margin-bottom:4px}.stat .value{font-weight:950;font-size:clamp(18px,3.3vw,25px);font-variant-numeric:tabular-nums}.game-wrap{position:relative;border-radius:22px;overflow:hidden;background:#dff4ff;isolation:isolate;touch-action:none}.game-wrap canvas{display:block;width:100%;height:auto;aspect-ratio: 1.55;touch-action:none}.overlay{position:absolute;inset:0;background:rgba(236,249,255,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:3;transition:opacity .15s}.overlay.hidden{display:none}.modal{text-align:center;background:rgba(255,255,255,.96);border:2px solid white;box-shadow:0 20px 54px #548eb344;border-radius:28px;width:min(100%,380px);padding:23px 22px 24px;animation:pop .3s ease both}.mascot{font-size:56px;line-height:1.2;display:block;animation:bob 2s ease-in-out infinite}.modal h2{font-size:25px;letter-spacing:-1px;margin:10px 0 6px}.modal p{font-size:14px;line-height:1.7;color:#6c829d;margin:0 0 17px;word-break:keep-all}.main-btn{border:0;border-radius:16px;background:linear-gradient(135deg,#58b1ff,#4b87ed);padding:13px 27px;color:white;font-weight:950;font-size:16px;box-shadow:0 8px 0 #3275d2,0 12px 24px #559edf45;transition:transform .1s,box-shadow .1s}.main-btn:active{transform:translateY(5px);box-shadow:0 3px 0 #3275d2}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:13px;flex-wrap:wrap}.tip{font-size:12px;color:#7188a5;font-weight:700;line-height:1.6}.buttons{display:flex;gap:8px}.mini-btn{border:1px solid #daeafb;background:#f6fbff;color:#42658f;border-radius:12px;padding:9px 13px;font-weight:850;font-size:12px;transition:background .15s,transform .1s}.mini-btn:active{transform:scale(.96)}.mini-btn:hover{background:#e8f5ff}.legend{display:flex;gap:13px;justify-content:center;margin-top:15px;flex-wrap:wrap;color:#7186a3;font-size:12px;font-weight:800}.legend span{white-space:nowrap}.footer{text-align:center;font-size:11px;color:#96aac0;margin-top:15px;font-weight:700}@keyframes pop{from{opacity:0;transform:translateY(13px) scale(.95)}to{opacity:1;transform:none}}@keyframes bob{50%{transform:translateY(-7px)}}@media(max-width:600px){body{padding:12px 10px 20px;align-items:flex-start}.top{padding:2px 3px}.brand-icon{width:43px;height:43px;font-size:25px}.main{border-radius:23px;padding:10px}.stats{gap:6px;margin-bottom:9px}.stat{padding:10px 3px;border-radius:12px}.stat .label{font-size:10px}.game-wrap{border-radius:16px}.game-wrap canvas{aspect-ratio: .83}.modal{padding:17px 15px 20px;border-radius:22px}.mascot{font-size:45px}.modal h2{font-size:22px}.modal p{font-size:13px;margin-bottom:12px}.legend{gap:9px;font-size:11px}.controls{margin:11px 3px 2px}.tip{font-size:11px}.pill{font-size:11px;padding:8px 10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="shell">
 <header class="top"><div class="brand"><div class="brand-icon">🐰</div><div><h1>별별 토끼</h1><p class="subtitle">반짝반짝 별을 모아봐요 ✨</p></div></div><div class="pill">🏆 최고 기록 <span id="bestTop">0</span>점</div></header>
 <main class="main">
  <div class="stats"><div class="stat"><span class="label">⭐ 점수</span><span class="value" id="score">0</span></div><div class="stat"><span class="label">⏱️ 남은 시간</span><span class="value" id="time">45</span></div><div class="stat"><span class="label">💗 생명</span><span class="value" id="life">3</span></div><div class="stat"><span class="label">🔥 콤보</span><span class="value" id="combo">0</span></div></div>
  <div class="game-wrap" id="gameWrap" aria-label="별을 받으며 폭탄을 피하는 게임"><canvas id="game" width="800" height="520"></canvas>
   <div class="overlay" id="overlay"><div class="modal"><span class="mascot" id="modalEmoji">🐰🌟</span><h2 id="modalTitle">별별 토끼의 모험!</h2><p id="modalText">토끼를 움직여 떨어지는 <b>별</b>을 받아요!<br>💣 폭탄은 피하고, 💗 하트는 꼭 챙기세요.<br>45초 동안 최고 점수에 도전!</p><button type="button" class="main-btn" id="startBtn">게임 시작하기 ▶</button></div></div>
  </div>
  <div class="controls"><div class="tip">🖱️ 마우스 / 👆 화면 터치 / ⌨️ ← → 또는 A D 키로 움직여요</div><div class="buttons"><button class="mini-btn" type="button" id="soundBtn" aria-pressed="false">🔇 소리 끔</button><button class="mini-btn" type="button" id="pauseBtn">⏸️ 일시정지</button></div></div>
  <div class="legend"><span>⭐ 별 +10점</span><span>🌈 무지개별 +30점</span><span>💗 하트 +1생명</span><span>💣 폭탄 -1생명</span></div>
 </main><div class="footer">작고 귀여운 하루의 휴식 · 기록은 이 브라우저에 저장돼요</div>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),wrap=document.getElementById('gameWrap');
const el=id=>document.getElementById(id);const scoreEl=el('score'),timeEl=el('time'),lifeEl=el('life'),comboEl=el('combo'),bestTop=el('bestTop');
const overlay=el('overlay'),modalTitle=el('modalTitle'),modalText=el('modalText'),modalEmoji=el('modalEmoji'),startBtn=el('startBtn'),pauseBtn=el('pauseBtn'),soundBtn=el('soundBtn');
const W=800,H=520,gameTime=45;let state='ready',score=0,timeLeft=gameTime,lives=3,combo=0,best=0,objects=[],particles=[],floatText=[],spawnClock=0,last=0,elapsed=0,raf=0,keys={left:false,right:false},sound=false,audio=null;
const bunny={x:W/2,y:H-61,w:93,h:82,target:W/2};
try{best=Number(localStorage.getItem('star-bunny-best')||0)||0}catch(e){}bestTop.textContent=best;
const rand=(min,max)=>Math.random()*(max-min)+min;const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
function updateUI(){scoreEl.textContent=score;timeEl.textContent=Math.max(0,Math.ceil(timeLeft));lifeEl.textContent=lives;comboEl.textContent=combo;bestTop.textContent=best}
function tone(freq=650,dur=.1,type='sine'){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(.09,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function overlayShow(title,description,emoji,button){modalTitle.textContent=title;modalText.innerHTML=description;modalEmoji.textContent=emoji;startBtn.textContent=button;overlay.classList.remove('hidden')}
function start(){score=0;timeLeft=gameTime;lives=3;combo=0;objects=[];particles=[];floatText=[];spawnClock=.45;elapsed=0;bunny.x=W/2;bunny.target=W/2;keys.left=false;keys.right=false;state='playing';overlay.classList.add('hidden');pauseBtn.textContent='⏸️ 일시정지';last=performance.now();updateUI();tone(740,.1);if(!raf)raf=requestAnimationFrame(loop)}
function finish(){if(state==='over')return;state='over';if(score>best){best=score;try{localStorage.setItem('star-bunny-best',String(best))}catch(e){}}updateUI();let title=score>=300?'별 모으기 천재! 🎉':score>=140?'반짝반짝 성공!':'오늘도 수고했어요!';overlayShow(title,`<b>${score}점</b>을 모았어요!<br>최고 기록은 <b>${best}점</b>이에요.<br>한 번 더 도전해 볼까요?`,'🐰🏆','다시 도전하기 ↻');tone(590,.15)}
function pause(){if(state==='playing'){state='paused';overlayShow('잠깐 쉬어가요 ☁️','준비되면 이어서 별을 모아봐요!','🐰💤','계속하기 ▶');pauseBtn.textContent='▶️ 계속하기'}else if(state==='paused'){state='playing';overlay.classList.add('hidden');pauseBtn.textContent='⏸️ 일시정지';last=performance.now();if(!raf)raf=requestAnimationFrame(loop)}}
startBtn.addEventListener('click',()=>{if(state==='paused')pause();else start()});pauseBtn.addEventListener('click',()=>{if(state==='playing'||state==='paused')pause()});soundBtn.addEventListener('click',()=>{sound=!sound;soundBtn.textContent=sound?'🔊 소리 켬':'🔇 소리 끔';soundBtn.setAttribute('aria-pressed',String(sound));if(sound)tone(800,.08)});
function pointer(e){if(state!=='playing')return;const rect=canvas.getBoundingClientRect();bunny.target=clamp((e.clientX-rect.left)/rect.width*W,50,W-50)}wrap.addEventListener('pointermove',pointer);wrap.addEventListener('pointerdown',e=>{if(e.target===canvas){pointer(e);try{canvas.setPointerCapture(e.pointerId)}catch(err){}}});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','A','d','D'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.key===' '&&state==='playing'&&!e.repeat)pause();else if(e.key===' '&&state==='paused'&&!e.repeat)pause()});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false});window.addEventListener('blur',()=>{if(state==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});
function spawn(){let r=Math.random(),kind=r<.12?'bomb':r<.18?'heart':r<.26?'rainbow':'star';objects.push({x:rand(35,W-35),y:-35,kind,radius:kind==='bomb'?21:kind==='rainbow'?22:19,speed:rand(145,208)+elapsed*2,wiggle:rand(0,7),phase:rand(0,6.3),rotate:rand(0,6.3)})}
function burst(x,y,colors){for(let i=0;i<12;i++)particles.push({x,y,vx:rand(-160,160),vy:rand(-210,40),life:rand(.3,.65),max:.65,color:colors[i%colors.length],size:rand(2,5)})}
function label(x,y,text,color){floatText.push({x,y,text,color,life:.9})}
function collect(o){if(o.kind==='bomb'){lives--;combo=0;burst(o.x,o.y,['#788aa8','#a8b8ce']);label(o.x,o.y,'앗! -1 💥','#d75d80');tone(180,.2,'sawtooth');if(lives<=0)finish()}else if(o.kind==='heart'){lives=Math.min(5,lives+1);burst(o.x,o.y,['#ff8ead','#ffbed1']);label(o.x,o.y,'생명 +1','#e66d99');tone(770,.16)}else{combo++;let gain=o.kind==='rainbow'?30:10;if(combo>=5)gain+=5;score+=gain;burst(o.x,o.y,o.kind==='rainbow'?['#ff85ac','#88c9ff','#ffe282','#b8a2ff']:['#ffd45e','#fff0a5']);label(o.x,o.y,'+'+gain+(combo>=5?' 🔥':''),'#d59027');tone(o.kind==='rainbow'?950:630+Math.min(combo,10)*35,.09)}}
function update(dt){elapsed+=dt;timeLeft-=dt;if(timeLeft<=0){timeLeft=0;finish();return}let step=(keys.right?1:0)-(keys.left?1:0);if(step){bunny.target=clamp(bunny.target+step*520*dt,45,W-45)}bunny.x+=(bunny.target-bunny.x)*Math.min(1,dt*13);spawnClock-=dt;if(spawnClock<=0){spawn();spawnClock=rand(.34,.67)*Math.max(.62,1-elapsed/95)}for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.y+=o.speed*dt;o.phase+=dt*2.2;o.x+=Math.sin(o.phase)*o.wiggle*dt;o.rotate+=dt*1.1;if(Math.abs(o.x-bunny.x)<bunny.w*.43+o.radius*.72&&Math.abs(o.y-(bunny.y-5))<bunny.h*.31+o.radius*.55){objects.splice(i,1);collect(o)}else if(o.y>H+45){objects.splice(i,1);if(o.kind==='star'||o.kind==='rainbow')combo=0}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}for(let i=floatText.length-1;i>=0;i--){floatText[i].y-=52*dt;floatText[i].life-=dt;if(floatText[i].life<=0)floatText.splice(i,1)}updateUI()}
function roundRect(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()}
function starPath(cx,cy,r,points=5){ctx.beginPath();for(let i=0;i<points*2;i++){const a=-Math.PI/2+i*Math.PI/points,rr=i%2?r*.51:r;const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath()}
function drawBackground(t){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#bdeaff');grad.addColorStop(.7,'#e8f7ff');grad.addColorStop(1,'#fff8ef');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(let i=0;i<13;i++){const x=(i*131+53)%W,y=(i*73+32)%(H-105),r=2+(i%3);ctx.globalAlpha=.3+.25*Math.sin(t*1.5+i);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;function cloud(x,y,s){ctx.fillStyle='rgba(255,255,255,.74)';for(const [a,b,r] of [[0,0,25],[25,-10,31],[59,0,24]]){ctx.beginPath();ctx.arc(x+a*s,y+b*s,r*s,0,Math.PI*2);ctx.fill()}}cloud(75+Math.sin(t*.18)*18,78,1.15);cloud(570-Math.sin(t*.22)*24,132,.88);cloud(365+Math.cos(t*.15)*15,49,.65);ctx.fillStyle='#cdebc1';ctx.beginPath();ctx.ellipse(130,H+70,290,140,0,0,Math.PI*2);ctx.ellipse(650,H+60,340,128,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b4dfa9';ctx.beginPath();ctx.ellipse(450,H+110,400,122,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff7e8';ctx.fillRect(0,H-32,W,32);for(let i=0;i<22;i++){let x=i*38+10;ctx.fillStyle=i%3===0?'#ffdf99':'#c3dfaa';ctx.beginPath();ctx.arc(x,H-31-(i%3)*2,3,0,Math.PI*2);ctx.fill()}}
function drawBunny(t){ctx.save();ctx.translate(bunny.x,bunny.y);const bob=state==='playing'?Math.sin(t*7)*2:0;ctx.translate(0,bob);ctx.fillStyle='rgba(58,99,120,.13)';ctx.beginPath();ctx.ellipse(0,45,48,10,0,0,6.3);ctx.fill();ctx.save();ctx.rotate(-.13);roundRect(-29,-82,24,60,13,'#ffffff');roundRect(-24,-74,13,43,8,'#ffb9cd');ctx.restore();ctx.save();ctx.rotate(.13);roundRect(5,-82,24,60,13,'#ffffff');roundRect(11,-74,13,43,8,'#ffb9cd');ctx.restore();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,-2,49,42,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f9d6e4';ctx.beginPath();ctx.arc(-27,6,10,0,6.3);ctx.arc(27,6,10,0,6.3);ctx.fill();ctx.fillStyle='#3b4c68';ctx.beginPath();ctx.ellipse(-17,-8,4.4,6,0,0,6.3);ctx.ellipse(17,-8,4.4,6,0,0,6.3);ctx.fill();ctx.fillStyle='#ff91b1';ctx.beginPath();ctx.arc(0,3,4,0,6.3);ctx.fill();ctx.strokeStyle='#59647e';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.arc(-7,4,7,.12,1.24);ctx.arc(7,4,7,1.9,3.03);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-38,30,15,8,-.2,0,6.3);ctx.ellipse(38,30,15,8,.2,0,6.3);ctx.fill();ctx.restore()}
function drawHeart(x,y,r){ctx.save();ctx.translate(x,y);ctx.scale(r/22,r/22);ctx.beginPath();ctx.moveTo(0,19);ctx.bezierCurveTo(-5,15,-23,1,-20,-9);ctx.bezierCurveTo(-18,-23,-3,-23,0,-13);ctx.bezierCurveTo(8,-25,23,-19,20,-7);ctx.bezierCurveTo(18,3,5,16,0,19);ctx.closePath();ctx.fillStyle='#ff7fa6';ctx.shadowColor='#ef80a5';ctx.shadowBlur=12;ctx.fill();ctx.restore()}
function drawItem(o,t){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(Math.sin(o.rotate)*.12);if(o.kind==='star'||o.kind==='rainbow'){const rainbow=o.kind==='rainbow';ctx.shadowColor=rainbow?'#ff82b9':'#f4c348';ctx.shadowBlur=17;starPath(0,0,o.radius);ctx.fillStyle=rainbow?'#f8a5e0':'#ffcc58';ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=2;ctx.strokeStyle=rainbow?'#ee80cb':'#ecae41';ctx.stroke();ctx.fillStyle='#ffffff';ctx.globalAlpha=.75;ctx.beginPath();ctx.arc(-5,-5,3,0,6.3);ctx.fill();if(rainbow){ctx.fillStyle='#7be6f5';ctx.beginPath();ctx.arc(5,2,4,0,6.3);ctx.fill()}}else if(o.kind==='heart')drawHeart(0,0,o.radius);else{ctx.fillStyle='#434c69';ctx.shadowColor='#717c96';ctx.shadowBlur=9;ctx.beginPath();ctx.arc(0,0,20,0,6.3);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#f4b766';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(3,-18);ctx.lineTo(8,-27);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText('×',0,6)}ctx.restore()}
function draw(t){ctx.clearRect(0,0,W,H);drawBackground(t);for(const o of objects)drawItem(o,t);drawBunny(t);for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.3);ctx.fill()}ctx.globalAlpha=1;for(const f of floatText){ctx.globalAlpha=clamp(f.life/.9,0,1);ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.strokeText(f.text,f.x,f.y);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y)}ctx.globalAlpha=1}
function loop(now){raf=0;const dt=Math.min(.04,(now-last)/1000||0);last=now;if(state==='playing')update(dt);draw(now/1000);if(state==='playing')raf=requestAnimationFrame(loop)}
updateUI();draw(0);
})();
</script>
</body>
</html>
