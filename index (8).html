<title>업무한눈에 | 공무원 업무 관리</title>
<style>
:root{--bg:#f3f8ff;--surface:#fff;--ink:#203451;--muted:#71849b;--line:#dfeaf7;--mint:#318be8;--mint-dark:#1767ba;--mint-light:#e8f3ff;--shadow:0 14px 44px rgba(35,89,160,.075);--radius:19px}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #90c8ff;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}.app{max-width:1450px;margin:auto;min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}.sidebar{background:#173a67;color:#fff;padding:35px 20px;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:3px 8px 32px;font-size:20px;font-weight:800;letter-spacing:-.9px}.brand-logo{height:37px;width:37px;background:#8ad5ff;color:#114d83;border-radius:12px;display:grid;place-items:center;font-size:21px}.brand small{display:block;font-size:11px;letter-spacing:1.2px;color:#bddfff;font-weight:500}.side-label{font-size:11px;color:#8db9e7;letter-spacing:1.5px;margin:20px 13px 10px}.nav-item{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-radius:11px;background:transparent;color:#d1e4fa;font-weight:600;text-align:left;margin:3px 0}.nav-item:hover,.nav-item.active{background:rgba(117,186,255,.19);color:white}.nav-item .n{font-size:15px;width:22px;text-align:center}.nav-item .count{margin-left:auto;font-size:11px;color:#c0e8ff}.side-bottom{margin-top:auto;background:#234b7c;border:1px solid #3a6595;padding:17px;border-radius:15px}.side-bottom strong{font-size:13px}.side-bottom p{font-size:12px;color:#c5dcf5;margin:8px 0 0}.main{padding:34px 43px 58px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:27px}.eyebrow{color:var(--mint-dark);font-size:12px;font-weight:800;letter-spacing:1.7px;margin:0 0 6px}.topbar h1{font-size:30px;letter-spacing:-1.4px;line-height:1.25;margin:0}.topbar p.desc{font-size:14px;color:var(--muted);margin:9px 0 0}.today-pill{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);padding:11px 15px;border-radius:12px;color:#546d89;font-size:13px;white-space:nowrap}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:21px}.stat{background:var(--surface);padding:21px 20px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-height:119px}.stat-head{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:13px;color:#6a7f98;font-weight:600}.stat-icon{display:grid;place-items:center;height:32px;width:32px;border-radius:10px;background:#eaf3ff;font-size:16px}.stat strong{display:block;font-size:31px;letter-spacing:-1px;margin-top:7px}.stat strong small{font-size:13px;color:#9aacca;font-weight:500;margin-left:4px}.stat.alert .stat-icon{background:#fff1ea}.stat.done .stat-icon{background:#e7f5f0}.progress-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 21px;margin-bottom:22px;display:flex;align-items:center;gap:22px}.progress-text{min-width:170px}.progress-text strong{font-size:14px}.progress-text span{font-size:12px;color:var(--muted);display:block;margin-top:4px}.progress-track{flex:1;height:9px;background:#e5f0fc;border-radius:9px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#278bf1,#8bd5ff);width:0%;border-radius:9px;transition:width .35s ease}.progress-percent{font-weight:800;color:#207ad2;font-size:19px}.workspace{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow);overflow:hidden}.workspace-header{padding:24px 26px 17px;display:flex;justify-content:space-between;gap:16px;align-items:center}.workspace-header h2{font-size:19px;letter-spacing:-.5px;margin:0}.workspace-header p{font-size:12px;color:var(--muted);margin:3px 0 0}.primary{border:0;background:var(--mint);color:#fff;font-weight:700;border-radius:11px;padding:12px 18px;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:background .15s,transform .15s;white-space:nowrap}.primary:hover{background:var(--mint-dark);transform:translateY(-1px)}.filters{padding:0 26px 17px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.search-wrap{position:relative;flex:1;min-width:190px}.search-wrap span{position:absolute;left:13px;top:10px;color:#8aa0bd}.search-wrap input{width:100%;padding:11px 12px 11px 38px;border-radius:10px;border:1px solid var(--line);background:#fbfdff;font-size:13px}.filters select{border:1px solid var(--line);border-radius:10px;background:#fbfdff;color:#566f8c;padding:11px;font-size:13px;max-width:160px}.tabs{padding:0 26px;border-bottom:1px solid var(--line);display:flex;gap:26px;overflow-x:auto}.tab{background:transparent;border:0;border-bottom:3px solid transparent;white-space:nowrap;padding:14px 2px 13px;margin-bottom:-1px;color:#8799b2;font-size:13px;font-weight:700}.tab.active{color:var(--mint-dark);border-bottom-color:var(--mint)}.task-list{padding:6px 16px 14px}.task{display:flex;gap:14px;align-items:flex-start;padding:17px 10px;border-bottom:1px solid #edf3fc;transition:background .15s;border-radius:9px}.task:last-child{border-bottom:0}.task:hover{background:#f4f9ff}.check{flex:none;border:2px solid #bbcee5;width:23px;height:23px;border-radius:7px;background:white;display:grid;place-items:center;color:#fff;margin-top:4px;font-size:13px}.check.checked{background:var(--mint);border-color:var(--mint)}.task-content{flex:1;min-width:0}.task-top{display:flex;align-items:center;flex-wrap:wrap;gap:7px}.task-name{font-size:14px;font-weight:750;overflow-wrap:anywhere}.completed .task-name{text-decoration:line-through;color:#9baabd}.chip{font-size:10px;font-weight:750;padding:3px 7px;border-radius:5px;white-space:nowrap}.chip.high{background:#fff0ee;color:#e26b54}.chip.medium{background:#fff5dc;color:#a7791c}.chip.low{background:#e9f4ff;color:#3d81bd}.chip.status{background:#eef3f7;color:#648197}.task-note{color:#7c90aa;font-size:12px;margin:7px 0 0;white-space:pre-line;overflow-wrap:anywhere}.task-meta{display:flex;flex-wrap:wrap;gap:13px;margin-top:10px;font-size:11px;color:#7387a1}.task-meta .overdue{color:#df665a;font-weight:700}.task-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s}.task:hover .task-actions,.task:focus-within .task-actions{opacity:1}.icon-btn{width:32px;height:32px;border:none;border-radius:8px;background:transparent;color:#7892ad;display:grid;place-items:center;font-size:15px}.icon-btn:hover{color:#1767ba;background:#e7f2ff}.icon-btn.delete:hover{color:#cf5949;background:#fff0ed}.empty{text-align:center;padding:75px 20px;color:#788ea8}.empty-icon{font-size:38px;margin-bottom:12px}.empty strong{display:block;color:#264e7c;font-size:15px}.empty p{font-size:12px}.bottom-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:17px 26px;background:#fbfdff;border-top:1px solid var(--line);font-size:12px;color:#8195ad}.text-btn{border:0;background:none;color:#3975b8;font-size:12px;font-weight:700;padding:5px}.text-btn:hover{text-decoration:underline}.tools{display:flex;gap:8px;flex-wrap:wrap}.toast{position:fixed;right:28px;bottom:25px;background:#183f70;color:white;border-radius:12px;padding:13px 18px;font-size:13px;box-shadow:0 15px 35px #194f8730;z-index:20;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}dialog{border:none;border-radius:20px;padding:0;width:min(500px,calc(100% - 30px));box-shadow:0 35px 110px #173b6545;color:var(--ink)}dialog::backdrop{background:rgba(16,39,72,.52);backdrop-filter:blur(3px)}.modal-head{padding:25px 27px 15px;display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:21px}.modal-body{padding:0 27px 26px}.field{margin-top:16px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:7px;color:#526d8b}.field input,.field textarea,.field select{width:100%;border:1px solid #dbe8f8;border-radius:10px;padding:12px 13px;background:#fbfdff;color:#273f60;font-size:14px}.field textarea{min-height:86px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:13px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:25px}.secondary{padding:12px 18px;background:#e9f2fc;color:#446f9c;border:0;border-radius:10px;font-weight:700}.mobile-bar{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:1100px){.app{grid-template-columns:205px minmax(0,1fr)}.main{padding:28px 24px}.sidebar{padding:27px 13px}.summary{gap:10px}.stat{padding:17px 14px}}@media(max-width:750px){.app{display:block;padding-bottom:69px}.sidebar{display:none}.main{padding:25px 15px 30px}.topbar h1{font-size:26px}.topbar{align-items:center;margin-bottom:22px}.topbar p.desc{font-size:12px}.today-pill{padding:8px;font-size:11px}.summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{min-height:98px}.stat strong{font-size:26px;margin-top:4px}.progress-panel{gap:11px;padding:15px}.progress-text{min-width:100px}.progress-text strong{font-size:12px}.progress-text span{font-size:10px}.progress-percent{font-size:15px}.workspace-header{padding:20px 17px 17px}.workspace-header h2{font-size:17px}.primary{padding:11px 13px;font-size:12px}.filters{padding:0 17px 13px}.search-wrap{min-width:100%;}.filters select{flex:1;max-width:none;min-width:0}.tabs{padding:0 17px;gap:22px}.task-list{padding:4px 9px 12px}.task{gap:9px;padding:15px 8px}.task-actions{opacity:1}.icon-btn{width:27px}.task-top{gap:5px}.task-name{font-size:13px}.bottom-toolbar{padding:15px;flex-wrap:wrap}.mobile-bar{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 4px max(7px,env(safe-area-inset-bottom))}.mobile-nav{background:none;border:0;color:#82958e;display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:700;gap:2px;min-width:60px;padding:3px}.mobile-nav.active{color:var(--mint-dark)}.mobile-nav span{font-size:19px}.form-row{grid-template-columns:1fr 1fr}}@media(max-width:370px){.today-pill{display:none}.filters select{font-size:11px;padding:10px 5px}.task-actions{flex-direction:column}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" aria-label="업무 메뉴"><div class="brand"><span class="brand-logo">✓</span><div>업무한눈에<small>SMART WORKSPACE</small></div></div><div class="side-label">WORKSPACE</div><nav id="sideNav"><button class="nav-item active" data-view="all"><span class="n">▦</span> 전체 업무 <span class="count" id="sideAll">0</span></button><button class="nav-item" data-view="today"><span class="n">◷</span> 오늘 할 일</button><button class="nav-item" data-view="upcoming"><span class="n">▤</span> 예정 업무</button><button class="nav-item" data-view="completed"><span class="n">✓</span> 완료 업무</button></nav><div class="side-label">QUICK TOOLS</div><button class="nav-item" id="exportSide"><span class="n">⇩</span> 데이터 백업</button><button class="nav-item" id="importSide"><span class="n">⇧</span> 백업 불러오기</button><div class="side-bottom"><strong>🌿 오늘도 차근차근</strong><p>중요한 업무부터 하나씩. 업무는 이 브라우저에 자동 저장됩니다.</p></div></aside>
<main class="main"><header class="topbar"><div><p class="eyebrow">MY WORK DASHBOARD</p><h1>오늘의 업무를 정리해요 <span aria-hidden="true">✳</span></h1><p class="desc">해야 할 일은 명확하게, 업무 관리는 가볍게.</p></div><div class="today-pill"><span>📅</span><span id="todayLabel"></span></div></header>
<section class="summary" aria-label="업무 현황"><div class="stat"><div class="stat-head">전체 업무 <span class="stat-icon">▦</span></div><strong id="totalCount">0<small>건</small></strong></div><div class="stat"><div class="stat-head">진행 중 <span class="stat-icon">◷</span></div><strong id="activeCount">0<small>건</small></strong></div><div class="stat alert"><div class="stat-head">기한 초과 <span class="stat-icon">⚑</span></div><strong id="overdueCount">0<small>건</small></strong></div><div class="stat done"><div class="stat-head">완료 업무 <span class="stat-icon">✓</span></div><strong id="doneCount">0<small>건</small></strong></div></section>
<section class="progress-panel" aria-label="업무 완료율"><div class="progress-text"><strong>📈 전체 업무 진행률</strong><span id="progressMessage">업무를 등록해보세요</span></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><span class="progress-percent" id="progressPercent">0%</span></section>
<section class="workspace"><div class="workspace-header"><div><h2 id="sectionTitle">업무 목록</h2><p id="sectionSubtitle">해야 할 업무를 한 곳에서 관리하세요.</p></div><button class="primary" id="addBtn"><span style="font-size:17px;line-height:1">＋</span> 새 업무 등록</button></div><div class="filters"><label class="search-wrap"><span>⌕</span><span class="sr-only">업무 검색</span><input id="searchInput" placeholder="업무명, 메모 검색" autocomplete="off" /></label><select id="categoryFilter" aria-label="업무 분류"><option value="all">전체 분류</option><option>민원</option><option>보고·문서</option><option>회의·행사</option><option>예산·회계</option><option>사업·기획</option><option>기타</option></select><select id="priorityFilter" aria-label="우선순위"><option value="all">모든 우선순위</option><option value="high">긴급</option><option value="medium">보통</option><option value="low">여유</option></select><select id="sortFilter" aria-label="정렬"><option value="due">마감일순</option><option value="priority">우선순위순</option><option value="new">최근 등록순</option></select></div><div class="tabs" id="tabs"><button class="tab active" data-view="all">전체 보기</button><button class="tab" data-view="today">오늘 할 일</button><button class="tab" data-view="upcoming">예정</button><button class="tab" data-view="completed">완료</button></div><div id="taskList" class="task-list" aria-live="polite"></div><div class="bottom-toolbar"><span id="listCount">0개의 업무</span><div class="tools"><button class="text-btn" id="clearCompleted">완료 업무 정리</button><button class="text-btn" id="exportBottom">↓ JSON 백업</button></div></div></section></main></div>
<nav class="mobile-bar" aria-label="모바일 업무 메뉴"><button class="mobile-nav active" data-view="all"><span>▦</span>전체</button><button class="mobile-nav" data-view="today"><span>◷</span>오늘</button><button class="mobile-nav" data-view="upcoming"><span>▤</span>예정</button><button class="mobile-nav" data-view="completed"><span>✓</span>완료</button></nav>
<dialog id="taskDialog" aria-labelledby="dialogTitle"><div class="modal-head"><h2 id="dialogTitle">새 업무 등록</h2><button class="icon-btn" id="closeDialog" aria-label="닫기">✕</button></div><form id="taskForm" class="modal-body"><input type="hidden" id="taskId"/><div class="field"><label for="taskTitle">업무명 <span style="color:#d96555">*</span></label><input id="taskTitle" placeholder="예: 11월 민원 처리 현황 보고" maxlength="120" required /></div><div class="field"><label for="taskNote">세부 내용 / 메모</label><textarea id="taskNote" placeholder="관련 내용, 확인사항 등을 적어주세요." maxlength="3000"></textarea></div><div class="form-row"><div class="field"><label for="taskCategory">업무 분류</label><select id="taskCategory"><option>보고·문서</option><option>민원</option><option>회의·행사</option><option>예산·회계</option><option>사업·기획</option><option>기타</option></select></div><div class="field"><label for="taskPriority">우선순위</label><select id="taskPriority"><option value="medium">보통</option><option value="high">긴급</option><option value="low">여유</option></select></div></div><div class="form-row"><div class="field"><label for="taskDue">마감일</label><input id="taskDue" type="date" /></div><div class="field"><label for="taskStatus">진행 상태</label><select id="taskStatus"><option value="todo">할 일</option><option value="doing">진행 중</option><option value="done">완료</option></select></div></div><div class="modal-actions"><button class="secondary" type="button" id="cancelBtn">취소</button><button class="primary" type="submit">저장하기</button></div></form></dialog><input id="fileImport" type="file" accept=".json,application/json" hidden/><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const KEY = 'gov-todo-mint-v1'; // Keep previous saved tasks compatible.
  const $ = (id) => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const dateString = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const today = dateString();
  const categories = ['민원','보고·문서','회의·행사','예산·회계','사업·기획','기타'];
  const priorities = ['high','medium','low'];
  const statuses = ['todo','doing','done'];
  const makeId = () => (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function')
    ? crypto.randomUUID() : `task-${Date.now()}-${Math.random().toString(36).slice(2,11)}`;
  const normalize = t => ({
    id: String(t.id || makeId()), title: String(t.title || '').slice(0,120),
    note: String(t.note || '').slice(0,3000),
    category: categories.includes(t.category) ? t.category : '기타',
    priority: priorities.includes(t.priority) ? t.priority : 'medium',
    due: /^\d{4}-\d{2}-\d{2}$/.test(t.due || '') ? t.due : '',
    status: statuses.includes(t.status) ? t.status : 'todo',
    created: Number(t.created) || Date.now()
  });
  const escapeHTML = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let tasks = [];
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || '[]');
    if (Array.isArray(saved)) tasks = saved.filter(t => t && typeof t.title === 'string' && t.title.trim()).map(normalize);
  } catch (err) { console.warn('저장 데이터 로드 실패:', err); }
  let view = 'all';
  let toastTimer;
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); return true; }
    catch (err) { notify('브라우저 저장이 제한되었습니다. JSON 백업을 이용해주세요.'); return false; }
  };
  function notify(message) {
    $('toast').textContent = message;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2600);
  }
  const labelDue = s => s ? `${Number(s.slice(5,7))}월 ${Number(s.slice(8,10))}일` : '마감일 미지정';
  const viewTitles = {
    all: ['업무 목록','해야 할 업무를 한 곳에서 관리하세요.'],
    today: ['오늘 할 일','오늘 마감하거나 기한이 지난 업무입니다.'],
    upcoming: ['예정 업무','내일 이후 마감하는 업무입니다.'],
    completed: ['완료 업무','완료한 업무를 확인할 수 있습니다.']
  };
  function render() {
    const total = tasks.length;
    const done = tasks.filter(t => t.status === 'done').length;
    const active = total - done;
    const overdue = tasks.filter(t => t.status !== 'done' && t.due && t.due < today).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    for (const [id, count] of [['totalCount',total],['activeCount',active],['overdueCount',overdue],['doneCount',done]]) {
      $(id).innerHTML = `${count}<small>건</small>`;
    }
    $('sideAll').textContent = total;
    $('progressFill').style.width = `${pct}%`;
    $('progressPercent').textContent = `${pct}%`;
    $('progressMessage').textContent = total ? `${total}건 중 ${done}건 완료` : '업무를 등록해보세요';
    $('sectionTitle').textContent = viewTitles[view][0];
    $('sectionSubtitle').textContent = viewTitles[view][1];
    document.querySelectorAll('[data-view]').forEach(button => {
      const current = button.dataset.view === view;
      button.classList.toggle('active', current);
      if (button.classList.contains('tab')) button.setAttribute('aria-selected', String(current));
    });
    const q = $('searchInput').value.trim().toLocaleLowerCase();
    const cat = $('categoryFilter').value;
    const priority = $('priorityFilter').value;
    const sort = $('sortFilter').value;
    const matching = tasks.filter(t => {
      if (view === 'completed' && t.status !== 'done') return false;
      if (view === 'today' && (t.status === 'done' || !t.due || t.due > today)) return false;
      if (view === 'upcoming' && (t.status === 'done' || !t.due || t.due <= today)) return false;
      if (cat !== 'all' && t.category !== cat) return false;
      if (priority !== 'all' && t.priority !== priority) return false;
      if (q && !`${t.title} ${t.note} ${t.category}`.toLocaleLowerCase().includes(q)) return false;
      return true;
    });
    const priorityOrder = {high:0, medium:1, low:2};
    matching.sort((a,b) => {
      if (sort === 'new') return b.created - a.created;
      if (sort === 'priority') return priorityOrder[a.priority] - priorityOrder[b.priority] || (a.due || '9999').localeCompare(b.due || '9999');
      return Number(a.status === 'done') - Number(b.status === 'done') ||
        (a.due || '9999').localeCompare(b.due || '9999') || priorityOrder[a.priority] - priorityOrder[b.priority];
    });
    $('listCount').textContent = `${matching.length}개의 업무 표시 · 전체 ${total}개`;
    if (!matching.length) {
      $('taskList').innerHTML = `<div class="empty"><div class="empty-icon">📋</div><strong>${total ? '조건에 맞는 업무가 없습니다.' : '아직 등록된 업무가 없습니다.'}</strong><p>${total ? '검색 조건을 바꾸거나 다른 탭을 선택해보세요.' : '「새 업무 등록」 버튼을 눌러 첫 업무를 추가해보세요.'}</p></div>`;
      return;
    }
    const priorityLabels = {high:'긴급',medium:'보통',low:'여유'};
    $('taskList').innerHTML = matching.map(t => {
      const completed = t.status === 'done';
      const late = !completed && t.due && t.due < today;
      const dueToday = !completed && t.due === today;
      return `<article class="task ${completed ? 'completed' : ''}">
        <button type="button" class="check ${completed ? 'checked' : ''}" data-action="toggle" data-id="${escapeHTML(t.id)}" aria-label="${completed ? '완료 취소' : '업무 완료'}" aria-pressed="${completed}">${completed ? '✓' : ''}</button>
        <div class="task-content">
          <div class="task-top"><span class="task-name">${escapeHTML(t.title)}</span><span class="chip ${t.priority}">${priorityLabels[t.priority]}</span>${t.status === 'doing' ? '<span class="chip status">진행 중</span>' : ''}</div>
          ${t.note ? `<p class="task-note">${escapeHTML(t.note)}</p>` : ''}
          <div class="task-meta"><span>▦ ${escapeHTML(t.category)}</span><span class="${late || dueToday ? 'overdue' : ''}">◷ ${labelDue(t.due)}${late ? ' · 기한 초과' : dueToday ? ' · 오늘 마감' : ''}</span><span>${completed ? '✓ 완료' : t.status === 'doing' ? '● 진행 중' : '○ 할 일'}</span></div>
        </div>
        <div class="task-actions"><button type="button" class="icon-btn" data-action="edit" data-id="${escapeHTML(t.id)}" title="수정" aria-label="업무 수정">✎</button><button type="button" class="icon-btn delete" data-action="delete" data-id="${escapeHTML(t.id)}" title="삭제" aria-label="업무 삭제">✕</button></div>
      </article>`;
    }).join('');
  }
  function openModal(task) {
    $('taskForm').reset();
    $('taskId').value = task ? task.id : '';
    $('dialogTitle').textContent = task ? '업무 수정' : '새 업무 등록';
    $('taskTitle').value = task ? task.title : '';
    $('taskNote').value = task ? task.note : '';
    $('taskCategory').value = task ? task.category : '보고·문서';
    $('taskPriority').value = task ? task.priority : 'medium';
    $('taskDue').value = task ? task.due : '';
    $('taskStatus').value = task ? task.status : 'todo';
    const dialog = $('taskDialog');
    if (typeof dialog.showModal === 'function') dialog.showModal();
    else dialog.setAttribute('open', '');
    $('taskTitle').focus();
  }
  function closeModal() {
    const dialog = $('taskDialog');
    if (typeof dialog.close === 'function') dialog.close();
    else dialog.removeAttribute('open');
  }
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { view = b.dataset.view; render(); }));
  ['searchInput','categoryFilter','priorityFilter','sortFilter'].forEach(id => {
    $(id).addEventListener(id === 'searchInput' ? 'input' : 'change', render);
  });
  $('addBtn').addEventListener('click', () => openModal(null));
  $('closeDialog').addEventListener('click', closeModal);
  $('cancelBtn').addEventListener('click', closeModal);
  $('taskDialog').addEventListener('click', e => { if (e.target === $('taskDialog')) closeModal(); });
  $('taskForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('taskTitle').value.trim();
    if (!title) { $('taskTitle').focus(); return; }
    const id = $('taskId').value;
    const oldTask = tasks.find(t => t.id === id);
    const task = normalize({
      id: id || makeId(), title,
      note: $('taskNote').value.trim(), category: $('taskCategory').value,
      priority: $('taskPriority').value, due: $('taskDue').value,
      status: $('taskStatus').value, created: oldTask ? oldTask.created : Date.now()
    });
    if (id && oldTask) tasks[tasks.indexOf(oldTask)] = task;
    else tasks.unshift(task);
    save();
    closeModal();
    // Make newly saved tasks visible even if a tab/filter was hiding them.
    view = 'all';
    $('searchInput').value = '';
    $('categoryFilter').value = 'all';
    $('priorityFilter').value = 'all';
    render();
    notify(id ? '업무가 수정되었습니다.' : '새 업무가 등록되었습니다.');
  });
  $('taskList').addEventListener('click', e => {
    const button = e.target.closest('button[data-action]');
    if (!button) return;
    const task = tasks.find(t => t.id === button.dataset.id);
    if (!task) return;
    if (button.dataset.action === 'toggle') {
      task.status = task.status === 'done' ? 'todo' : 'done';
      save(); render(); notify(task.status === 'done' ? '업무를 완료했습니다.' : '업무를 다시 할 일로 옮겼습니다.');
    } else if (button.dataset.action === 'edit') {
      openModal(task);
    } else if (button.dataset.action === 'delete' && confirm(`「${task.title}」 업무를 삭제할까요?`)) {
      tasks = tasks.filter(t => t.id !== task.id);
      save(); render(); notify('업무가 삭제되었습니다.');
    }
  });
  $('clearCompleted').addEventListener('click', () => {
    const count = tasks.filter(t => t.status === 'done').length;
    if (!count) { notify('정리할 완료 업무가 없습니다.'); return; }
    if (confirm(`완료 업무 ${count}건을 모두 삭제할까요?`)) {
      tasks = tasks.filter(t => t.status !== 'done'); save(); render(); notify('완료 업무가 정리되었습니다.');
    }
  });
  function exportJSON() {
    const blob = new Blob([JSON.stringify({app:'업무한눈에', version:1, exportedAt:new Date().toISOString(), tasks},null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = `업무한눈에_백업_${today}.json`;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    notify('업무 백업 파일을 내려받았습니다.');
  }
  ['exportSide','exportBottom'].forEach(id => $(id).addEventListener('click', exportJSON));
  $('importSide').addEventListener('click', () => $('fileImport').click());
  $('fileImport').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      if (file.size > 5 * 1024 * 1024) throw new Error('파일이 너무 큽니다.');
      const data = JSON.parse(await file.text());
      const rows = Array.isArray(data) ? data : data.tasks;
      if (!Array.isArray(rows) || rows.length > 10000) throw new Error('올바른 백업 파일이 아닙니다.');
      const incoming = rows.filter(t => t && typeof t.title === 'string' && t.title.trim()).map(normalize);
      if (!confirm(`백업 파일의 업무 ${incoming.length}건으로 현재 데이터를 교체할까요?\n기존 업무는 덮어씁니다.`)) return;
      tasks = incoming; save(); view = 'all'; render(); notify('백업을 불러왔습니다.');
    } catch (err) { notify(err.message || '백업을 불러오지 못했습니다.'); }
    finally { e.target.value = ''; }
  });
  $('todayLabel').textContent = new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long'}).format(new Date());
  render();
})();
</script>
</body>
</html>
